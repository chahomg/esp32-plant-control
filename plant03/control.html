<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLANT-02 控制</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:#173a30;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.panel{background:white;border:1px solid #d8e5dc;border-radius:12px;padding:14px}h2{font-size:17px;margin:0 0 12px}.tabs{display:flex;max-width:310px;border:1px solid #b6d2c0;border-radius:8px;padding:3px;gap:3px;background:#f6faf7;margin-bottom:15px}.tabs button{flex:1;padding:7px 8px;font-size:13px;border:0;border-radius:6px;background:transparent;color:#486357}.tabs button.selected{background:#286f4e;color:white;font-weight:700}.section{border-top:1px solid #e2ebe5;padding:13px 0}.section:first-child{border-top:0;padding-top:0}.section-title{font-size:15px;font-weight:700;margin-bottom:9px}.controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.range{display:flex;gap:5px;align-items:end}.field{flex:1;min-width:0}.field label{display:block;font-size:11px;color:#667a6d;margin-bottom:5px}.field select{width:100%;background:white;border:1px solid #cbdcd0;border-radius:7px;padding:10px;font-size:16px;color:#173a30}.schedule-fields{display:grid;gap:14px}.field input{width:100%;min-width:0;border:1px solid #cbdcd0;border-radius:7px;padding:10px 4px;text-align:center;font-size:16px;color:#173a30}.tilde{padding-bottom:11px;color:#7b9282}.device-title{font-size:11px;color:#667a6d;margin-bottom:6px}.device{display:flex;align-items:center;gap:7px;font-size:12px;margin:8px 0;white-space:nowrap}.device input{accent-color:#28764f;width:17px;height:17px;margin:0}.submit{width:100%;padding:13px;border:0;border-radius:9px;background:#28764f;color:white;font-size:16px;font-weight:700;margin-top:8px}.indicators{display:flex;justify-content:space-evenly;align-items:center;gap:8px;padding:15px 0 2px}.indicator{display:flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}.light{width:12px;height:12px;border-radius:50%;background:#cbd1ce;display:inline-block}.light.orange.on{background:#f59e0b;box-shadow:0 0 8px #f59e0b80}.light.green.on{background:#22b35e;box-shadow:0 0 8px #22b35e80}.error{font-size:12px;color:#b03b2d;text-align:center;min-height:16px}.hidden{display:none}@media(max-width:370px){.device{font-size:11px}.controls{gap:8px}.panel{padding:11px}.indicator{font-size:11px}}
#control-availability{font-size:13px;color:#5a4a30;margin:0 0 12px}#upload:disabled{opacity:.55;cursor:not-allowed}
</style></head><body><section class="panel"><h2>環境自動控制</h2><p id="control-availability" role="status">目前可查看與試填設定。PLANT03 雲端控制尚未接通，上傳功能暫停。</p><div class="tabs"><button id="manualBtn" class="selected" type="button">手動設定</button><button id="suggestBtn" type="button">建議設定</button><button id="forceBtn" type="button">強制通風</button></div><div id="manual"><div class="section"><div class="section-title">溫度控制</div><div class="controls"><div class="range"><div class="field"><label for="th">高溫上限 °C</label><input id="th" type="number" value="28" step="0.1"></div></div><div><div class="device-title">控制設備</div><label class="device"><input type="checkbox">霧化器</label><label class="device"><input type="checkbox" checked>循環風扇</label><label class="device"><input type="checkbox" checked>通風風扇</label></div></div></div><div class="section"><div class="section-title">濕度控制</div><div class="controls"><div class="range"><div class="field"><label>下限 %</label><input id="hl" type="number" value="65" step="1"></div><span class="tilde">～</span><div class="field"><label>上限 %</label><input id="hh" type="number" value="85" step="1"></div></div><div><div class="device-title">控制設備</div><label class="device"><input type="checkbox" checked>霧化器</label><label class="device"><input type="checkbox">循環風扇</label><label class="device"><input type="checkbox">通風風扇</label></div></div></div></div><div id="suggest" class="hidden"><div class="schedule-fields"><div class="field"><label for="circulation_interval_minutes">共用啟動間隔（分鐘）</label><input type="number" inputmode="numeric" id="circulation_interval_minutes" value="30" min="2" max="1440" step="1"></div><div class="field"><label for="circulation_run_minutes">循環扇每次運轉（分鐘）</label><input type="number" inputmode="numeric" id="circulation_run_minutes" value="25" min="1" max="1439" step="1"></div><div class="field"><label for="ventilation_run_minutes">通風扇每次運轉（分鐘）</label><input type="number" inputmode="numeric" id="ventilation_run_minutes" value="3" min="1" max="1439" step="1"></div></div></div><div id="force" class="hidden"><div class="schedule-fields"><div class="field"><label for="forceInterval">共用啟動間隔（分鐘）</label><input type="number" inputmode="numeric" id="forceInterval" value="30" min="2" max="1440" step="1"></div><div class="field"><label for="forceVentRun">通風扇每次運轉（分鐘）</label><input type="number" inputmode="numeric" id="forceVentRun" value="15" min="1" max="1439" step="1"></div><div class="field"><label for="forceCircRun">循環扇每次運轉（分鐘）</label><input type="number" inputmode="numeric" id="forceCircRun" value="25" min="1" max="1439" step="1"></div><div class="field"><label for="forceHours">持續時間（小時）</label><input type="number" inputmode="numeric" id="forceHours" value="8" min="1" max="24" step="1"></div></div><p id="forceCountdown">尚無已送出的強制通風</p><p>到期後自動恢復原控制。上傳手動或建議設定可提前結束。</p></div><button class="submit" id="upload" disabled aria-describedby="control-availability" type="button">上傳設定</button><div class="indicators"><div class="indicator"><span id="orange" class="light orange"></span>上傳中</div><div class="indicator"><span id="green" class="light green"></span>上傳設定完成</div></div><div id="error" class="error" aria-live="polite">正在讀取 Firebase 已儲存設定…</div></section><script>
const $ = id => document.getElementById(id);
function switchTab(mode) {
  for (const key of ['manual', 'suggest', 'force']) {
    $(key + 'Btn').classList.toggle('selected', key === mode);
    $(key).classList.toggle('hidden', key !== mode);
  }
  $('upload').textContent = mode === 'force' ? '啟動強制通風' : '上傳設定';
}
for (const mode of ['manual', 'suggest', 'force']) {
  $(mode + 'Btn').onclick = () => switchTab(mode);
}
</script></body></html>
