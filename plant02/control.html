<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLANT-02 控制</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:#173a30;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.panel{background:white;border:1px solid #d8e5dc;border-radius:12px;padding:14px}h2{font-size:17px;margin:0 0 12px}.tabs{display:flex;max-width:310px;border:1px solid #b6d2c0;border-radius:8px;padding:3px;gap:3px;background:#f6faf7;margin-bottom:15px}.tabs button{flex:1;padding:7px 8px;font-size:13px;border:0;border-radius:6px;background:transparent;color:#486357}.tabs button.selected{background:#286f4e;color:white;font-weight:700}.section{border-top:1px solid #e2ebe5;padding:13px 0}.section:first-child{border-top:0;padding-top:0}.section-title{font-size:15px;font-weight:700;margin-bottom:9px}.controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.range{display:flex;gap:5px;align-items:end}.field{flex:1;min-width:0}.field label{display:block;font-size:11px;color:#667a6d;margin-bottom:5px}.field input{width:100%;min-width:0;border:1px solid #cbdcd0;border-radius:7px;padding:10px 4px;text-align:center;font-size:16px;color:#173a30}.tilde{padding-bottom:11px;color:#7b9282}.device-title{font-size:11px;color:#667a6d;margin-bottom:6px}.device{display:flex;align-items:center;gap:7px;font-size:12px;margin:8px 0;white-space:nowrap}.device input{accent-color:#28764f;width:17px;height:17px;margin:0}.submit{width:100%;padding:13px;border:0;border-radius:9px;background:#28764f;color:white;font-size:16px;font-weight:700;margin-top:8px}.indicators{display:flex;justify-content:space-evenly;align-items:center;gap:8px;padding:15px 0 2px}.indicator{display:flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}.light{width:12px;height:12px;border-radius:50%;background:#cbd1ce;display:inline-block}.light.orange.on{background:#f59e0b;box-shadow:0 0 8px #f59e0b80}.light.green.on{background:#22b35e;box-shadow:0 0 8px #22b35e80}.error{font-size:12px;color:#b03b2d;text-align:center;min-height:16px}.hidden{display:none}@media(max-width:370px){.device{font-size:11px}.controls{gap:8px}.panel{padding:11px}.indicator{font-size:11px}}
</style></head><body><section class="panel"><h2>環境自動控制</h2><div class="tabs"><button id="manualBtn" class="selected" type="button">手動設定</button><button id="suggestBtn" type="button">建議設定</button></div><div id="manual"><div class="section"><div class="section-title">溫度控制</div><div class="controls"><div class="range"><div class="field"><label for="th">高溫上限 °C</label><input id="th" type="number" value="28" step="0.1"></div></div><div><div class="device-title">控制設備</div><label class="device"><input type="checkbox">霧化器</label><label class="device"><input type="checkbox" checked>循環風扇</label><label class="device"><input type="checkbox" checked>通風風扇</label></div></div></div><div class="section"><div class="section-title">濕度控制</div><div class="controls"><div class="range"><div class="field"><label>下限 %</label><input id="hl" type="number" value="65" step="1"></div><span class="tilde">～</span><div class="field"><label>上限 %</label><input id="hh" type="number" value="85" step="1"></div></div><div><div class="device-title">控制設備</div><label class="device"><input type="checkbox" checked>霧化器</label><label class="device"><input type="checkbox">循環風扇</label><label class="device"><input type="checkbox">通風風扇</label></div></div></div><button class="submit" id="upload" type="button">上傳設定</button><div class="indicators"><div class="indicator"><span id="orange" class="light orange"></span>上傳中</div><div class="indicator"><span id="green" class="light green"></span>上傳設定完成</div></div><div id="error" class="error" aria-live="polite"></div></div><div id="suggest" class="hidden"></div></section><script>
const $=id=>document.getElementById(id);
const path='plantGatewayV1/controlDrafts/PLANT-02';
const fields=[...document.querySelectorAll('.section')];
function reset(){ $('orange').classList.remove('on');$('green').classList.remove('on');$('error').textContent='';}
document.querySelectorAll('input').forEach(x=>x.addEventListener('input',reset));
function switchTab(mode){let manual=mode==='manual';$('manualBtn').classList.toggle('selected',manual);$('suggestBtn').classList.toggle('selected',!manual);$('manual').classList.toggle('hidden',!manual);$('suggest').classList.toggle('hidden',manual)}
$('manualBtn').onclick=()=>switchTab('manual');$('suggestBtn').onclick=()=>switchTab('suggest');
function devices(section){return Object.fromEntries(['mist','circulation_fan','ventilation_fan'].map((key,i)=>[key,section.querySelectorAll('input[type=checkbox]')[i].checked]));}
let pendingId=null;
$('upload').onclick=()=>{
 reset();
 const [th,hl,hh]=['th','hl','hh'].map(id=>$(id).value);
 if([th,hl,hh].some(v=>v.trim()===''||!Number.isFinite(Number(v)))||Number(hl)>=Number(hh)||Number(hl)<0||Number(hh)>100){$('error').textContent='請檢查高溫上限與濕度範圍';return;}
 pendingId='web-'+Date.now()+'-'+Math.random().toString(36).slice(2,9);
 $('orange').classList.add('on');$('error').textContent='正在寫入 Firebase…';
 parent.postMessage({type:'plant02-control-save',request_id:pendingId,config:{mode:'manual',temperature:{high_limit:Number(th),devices:devices(fields[0])},humidity:{low_limit:Number(hl),high_limit:Number(hh),devices:devices(fields[1])}}},location.origin);
};
window.addEventListener('message',e=>{
 if(e.origin!==location.origin||e.source!==parent||!e.data||e.data.type!=='plant02-control-result'||e.data.request_id!==pendingId)return;
 if(e.data.ok){$('error').textContent='Firebase 寫入及讀回核對成功；等待 ESP32 確認';}
 else{$('orange').classList.remove('on');$('error').textContent='Firebase 上傳失敗：'+String(e.data.error||'未知錯誤');}
});
</script></body></html>
