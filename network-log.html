<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>連線日誌｜鹿角蕨環境研究中心</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101f1a;color:#eef7f0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}main{max-width:520px;margin:auto;padding:16px 14px 35px}h1{font-size:23px;margin:8px 0}h2{font-size:16px;margin:0 0 12px}.muted{color:#b0c5ba;font-size:13px;line-height:1.6}.card{background:#21372c;border:1px solid #456554;border-radius:14px;padding:15px;margin:14px 0}button,.btn{background:#315d50;border:1px solid #79b8a0;border-radius:9px;color:#fff;padding:11px 12px;font-size:14px;cursor:pointer;display:inline-block;text-decoration:none}button:focus-visible,input:focus-visible{outline:2px solid #a6e9c3}.actions{display:flex;flex-wrap:wrap;gap:8px}input[type=url],input[type=file]{width:100%;margin:8px 0 12px;color:#fff}input[type=url]{padding:12px;border-radius:8px;background:#12251e;border:1px solid #648571}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:330px;overflow:auto;background:#0c1b15;padding:12px;border-radius:9px;font-size:12px;line-height:1.5}.status{color:#f2d18b}.good{color:#9de5b6}.bad{color:#ffb0a3}</style></head><body><main>
<a class="btn" href="index.html">← 返回監控</a><h1>連線日誌</h1><p class="muted">記錄網頁、區域網路、ESP32 讀取及資料同步狀態。所有診斷以實際測試結果為準；沒有取得資料時不標示成功。</p>
<section class="card"><h2>ESP32 日誌讀取</h2><label for="device">ESP32 裝置網址</label><input id="device" type="url" value="http://esp32-plant.local" placeholder="http://esp32-plant.local"><div class="actions"><button id="check">測試連線</button><button id="read">讀取 /network-log</button><button id="open">在新分頁開啟日誌</button></div><p id="state" class="status" role="status">尚未測試。</p><p class="muted">注意：GitHub Pages 是 HTTPS，瀏覽器可能阻擋對區域網路 HTTP 的直接讀取（混合內容／CORS／私人網路限制）。若失敗，請使用「在新分頁開啟日誌」測試裝置端點。ESP32 必須實際提供 /network-log 才能下載。</p></section>
<section class="card"><h2>匯入 ESP32／MicroSD 日誌</h2><input id="file" type="file" accept=".txt,.log,.csv,text/plain,text/csv"><div class="actions"><button id="copy">複製診斷報告</button><button id="download">下載診斷文字檔</button><button id="clear">清除本頁記錄</button></div><p class="muted">匯入只在本機瀏覽器讀取檔案，不會上傳到 ESP32 或雲端。</p></section>
<section class="card"><h2>網路診斷與事件紀錄</h2><pre id="log" aria-live="polite"></pre></section>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const events=[];let imported='';const ts=()=>new Date().toLocaleString('zh-TW',{hour12:false});const add=(level,msg)=>{events.push('['+ts()+'] ['+level+'] '+msg);$('log').textContent=events.join('\n');};const base=()=>{$('device').value=$('device').value.trim().replace(/\/+$/,'');return $('device').value};const report=()=>['鹿角蕨環境研究中心｜連線診斷報告','產生時間：'+ts(),'網頁：'+location.href,'瀏覽器：'+navigator.userAgent,'瀏覽器 online 狀態：'+navigator.onLine+'（不代表 ESP32 可達）','ESP32：'+base(),'','=== 事件紀錄 ===',...events,'','=== 匯入檔案 ===',imported||'未匯入'].join('\n');
add('INFO','日誌頁載入；瀏覽器 online='+navigator.onLine);add('INFO','目前頁面協定 '+location.protocol);window.addEventListener('online',()=>add('INFO','瀏覽器回報 online'));window.addEventListener('offline',()=>add('WARN','瀏覽器回報 offline'));
const run=async(path)=>{const root=base();if(!/^https?:\/\//i.test(root)){add('ERROR','裝置網址必須以 http:// 或 https:// 開頭');$('state').textContent='網址格式錯誤';return}const url=root+path;add('START','請求 '+url);$('state').textContent='連線中…';const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),9000);try{const r=await fetch(url,{cache:'no-store',signal:ctl.signal});const t=await r.text();add(r.ok?'PASS':'ERROR','HTTP '+r.status+' '+r.statusText+'；回應 '+t.length+' 字元');if(path==='/network-log'&&r.ok){imported='[ESP32 /network-log 回應]\n'+t.slice(0,500000);add('INFO','已取得裝置日誌，最多保留 500000 字元')}else if(!r.ok)add('ERROR','端點回應錯誤，請確認韌體路由');$('state').textContent=r.ok?'讀取成功（HTTP '+r.status+'）':'讀取失敗（HTTP '+r.status+'）'}catch(e){const reason=e.name==='AbortError'?'逾時（9 秒）':String(e.message||e);add('ERROR','讀取失敗：'+reason+'。可能為裝置離線、DNS、CORS、HTTPS 混合內容或端點未提供，無法僅憑此錯誤區分。');$('state').textContent='讀取失敗；請查看診斷紀錄'}finally{clearTimeout(timer)}};
$('check').onclick=()=>run('/');$('read').onclick=()=>run('/network-log');$('open').onclick=()=>{const root=base();if(!/^https?:\/\//i.test(root)){add('ERROR','裝置網址格式錯誤');return}window.open(root+'/network-log','_blank','noopener');add('INFO','已要求開啟 '+root+'/network-log；不代表端點成功')};
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){add('ERROR','檔案超過 5 MB，未匯入');return}try{imported='檔名：'+f.name+'\n'+await f.text();add('PASS','已在本機匯入 '+f.name+'，'+f.size+' bytes')}catch(err){add('ERROR','讀取檔案失敗：'+err.message)}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report());add('PASS','已複製診斷報告')}catch(e){add('ERROR','複製失敗：'+e.message)}};
$('download').onclick=()=>{const blob=new Blob([report()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='esp32-network-diagnostic-'+new Date().toISOString().slice(0,10)+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);add('INFO','已要求下載診斷文字檔')};
$('clear').onclick=()=>{events.length=0;imported='';add('INFO','使用者清除本頁記錄')};
})();</script></body></html>
